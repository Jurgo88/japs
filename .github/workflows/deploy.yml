# Deploys japs.app (ADR 0009) after CI passes on main: D1 migrations first, then the Worker
# with the freshly built dashboard. Migrations must stay additive, so the running version
# keeps working between the two steps. Can also be started by hand from the Actions tab.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in order; a newer one waits instead of cancelling a running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI tested, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply D1 migrations
        run: pnpm --filter @japs/api run db:migrate:remote
      - name: Deploy the Worker
        run: pnpm --filter @japs/api run deploy
      # Portfolios on <handle>.japs.app (ADR 0013): a separate, read-only Worker.
      - name: Deploy the portfolio Worker
        run: pnpm --filter @japs/api run deploy:sites
